  --bg: #11161b;

  --stage: #0c1116;

* { box-sizing: border-box; }
body {

}
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 32px; display: grid; gap: 16px; }
header h1 { font-size: 1.35rem; font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: .01em; }

.model {
  all: unset; cursor: pointer; padding: 7px 10px; border-radius: 7px; font-size: .92rem; line-height: 1.35;
  color: var(--ink);
}
.model:hover { background: var(--accent-soft); }

.model:focus-visible, .tool:focus-visible, input:focus-visible { outline: 2px solid var(--highlight); outline-offset: 2px; }
.main { display: grid; gap: 12px; min-width: 0; }

.tool {
  all: unset; cursor: pointer; font-size: .85rem; padding: 5px 11px; border-radius: 999px;

}
.tool[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 500; }
.sep { width: 1px; height: 20px; background: var(--line); margin-inline: 4px; }
.hint { position: absolute; left: 12px; top: 10px; font-size: .75rem; color: var(--muted); pointer-events: none; }
.legend { position: absolute; right: 12px; top: 10px; display: flex; gap: 10px; font-size: .78rem; color: var(--muted); pointer-events: none; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 1px solid var(--rim); }
.frame[hidden] { display: none; }
.frame { display: flex; align-items: center; gap: 10px; font-size: .85rem; }
.frame input { flex: 1; max-width: 360px; accent-color: var(--accent); }

.info h3 { margin: 0; font-size: 1.05rem; font-weight: 600; text-wrap: balance; }

.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0; }
.facts div { display: grid; }
.facts dt { font-size: .72rem; color: var(--muted); letter-spacing: .04em; }
.facts dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .95rem; }
.note { font-size: .8rem; color: var(--muted); }

<div class="wrap">
  <header>
    <h1>BaTiO3 × CO2 構造ビューア</h1>
    <p>計算キットが作る初期構造を 3D で確認できます。ドラッグで回転、ホイール / ピンチで拡大、上のボタンで視点を切り替え。CO2 は黄色の輪で強調しています。</p>
  </header>

  <div class="layout">
    <nav id="nav" aria-label="モデル"></nav>

    <div class="main">
      <div class="toolbar" role="toolbar" aria-label="表示">
        <button class="tool" id="v-side" type="button">横から (x-z)</button>
        <button class="tool" id="v-top" type="button">上から (x-y)</button>
        <button class="tool" id="v-tilt" type="button">斜め</button>
        <span class="sep" aria-hidden="true"></span>
        <button class="tool" id="t-rep" type="button" aria-pressed="true">周期で並べる</button>
        <button class="tool" id="t-cell" type="button" aria-pressed="true">セル枠</button>
        <button class="tool" id="t-fix" type="button" aria-pressed="false">固定原子を薄く</button>
      </div>

      <div class="stage" id="stage">
        <canvas id="cv" aria-label="結晶構造の 3D 表示"></canvas>
        <div class="legend" aria-hidden="true">
          <span><i class="dot" style="background:var(--ba)"></i>Ba</span>
          <span><i class="dot" style="background:var(--ti)"></i>Ti</span>
          <span><i class="dot" style="background:var(--o)"></i>O</span>
          <span><i class="dot" style="background:var(--c)"></i>C</span>
        </div>
        <div class="hint">ドラッグ: 回転 ・ ホイール/ピンチ: 拡大 ・ ダブルクリック: 視点リセット</div>
      </div>

      <div class="frame" id="frame" hidden>
        <label for="img">NEB 像</label>
        <input type="range" id="img" min="1" max="7" value="1" step="1">
        <output id="imgout" for="img">1 / 7</output>
      </div>

      <section class="info" aria-live="polite">
        <h3 id="title"></h3>
        <p id="desc"></p>
        <dl class="facts" id="facts"></dl>
        <p class="note">表示しているのは計算前の初期構造です (緩和前)。原子の大きさは見やすさのため実際の半径より小さくしています。</p>
      </section>
    </div>
  </div>
</div>

  const n = parseInt(hex.slice(1), 16);

// ---------- rotation matrices ----------

function mul(A, B) {

function rotY(t) { const c = Math.cos(t), s = Math.sin(t); return [[c, 0, s], [0, 1, 0], [-s, 0, c]]; }
function rotZ(t) { const c = Math.cos(t), s = Math.sin(t); return [[c, -s, 0], [s, c, 0], [0, 0, 1]]; }

// ---------- scene building ----------
function buildScene() {
  const m = MODELS[state.model];
  const f = m.frames[Math.min(state.frame, m.frames.length - 1)];
  const rep = state.rep ? m.rep : [1, 1, 1];
  const n = f.el.length, cell = f.cell;

  let k = 0;
  for (let a = 0; a < rep[0]; a++) for (let b = 0; b < rep[1]; b++) for (let c = 0; c < rep[2]; c++) {
    const off = [0, 1, 2].map((i) => a * cell[0][i] + b * cell[1][i] + c * cell[2][i]);
    for (let i = 0; i < n; i++) {
      pos.push(f.xyz[3 * i] + off[0], f.xyz[3 * i + 1] + off[1], f.xyz[3 * i + 2] + off[2]);
      el.push(f.el[i]); ads.push(f.ads[i]); fix.push(f.fix[i]);
    }

      g.addColorStop(1, shade(base, -0.35));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 0.8; ctx.strokeStyle = rim; ctx.stroke();
      if (isAds) {
        ctx.lineWidth = Math.max(1.5, 0.08 * scale); ctx.strokeStyle = hl;
        ctx.beginPath(); ctx.arc(p[0], p[1], r + ctx.lineWidth, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
  drawAxes(h);
}

function drawAxes(h) {
  const R = state.R, o = [34, h - 44], L = 22;
  const axes = [["x", [1, 0, 0]], ["y", [0, 1, 0]], ["z", [0, 0, 1]]];
  ctx.save();
  ctx.font = `11px ${css("--mono") || "monospace"}`;
  ctx.lineWidth = 1.5;
  const ink = css("--muted");
  for (const [name, v] of axes) {
    const sx = R[0][0] * v[0] + R[0][1] * v[1] + R[0][2] * v[2];
    const sy = R[1][0] * v[0] + R[1][1] * v[1] + R[1][2] * v[2];
    const ex = o[0] + L * sx, ey = o[1] - L * sy;
    ctx.strokeStyle = ink; ctx.fillStyle = ink;
    ctx.beginPath(); ctx.moveTo(o[0], o[1]); ctx.lineTo(ex, ey); ctx.stroke();
    if (Math.hypot(sx, sy) > 0.2) ctx.fillText(name, ex + 3 * Math.sign(sx || 1), ey - 3 * Math.sign(sy || 1) + 4);
  }
  ctx.restore();
}

// ---------- UI ----------
function renderNav() {
  const nav = $("nav"), groups = {};
  MODELS.forEach((m, i) => { (groups[m.group] ||= []).push(i); });
  nav.innerHTML = "";
  for (const [g, idx] of Object.entries(groups)) {
    const div = document.createElement("div"); div.className = "group";
    const h = document.createElement("h2"); h.textContent = g; div.appendChild(h);
    for (const i of idx) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "model"; b.textContent = MODELS[i].title; b.dataset.i = i;
      b.id = "m-" + MODELS[i].key;
      b.addEventListener("click", () => select(i));
      div.appendChild(b);
    }
    nav.appendChild(div);
  }
}

function setView(v) {
  state.R = VIEWS[v](); state.zoom = 1; state.pan = [0, 0];
  for (const k of ["side", "top", "tilt"]) $("v-" + k).setAttribute("aria-pressed", String(k === v));
  draw();
}

function select(i) {
  state.model = i; state.frame = 0;
  const m = MODELS[i];
  document.querySelectorAll(".model").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.i === i)));
  $("title").textContent = m.title;
  $("desc").textContent = m.desc;
  const facts = $("facts"); facts.innerHTML = "";
  for (const [k, v] of m.facts) {
    const d = document.createElement("div");
    d.innerHTML = "<dt></dt><dd></dd>"; d.firstChild.textContent = k; d.lastChild.textContent = v;
    facts.appendChild(d);
  }
  const fr = $("frame");
  fr.hidden = m.frames.length < 2;
  $("img").max = m.frames.length; $("img").value = 1; $("imgout").textContent = `1 / ${m.frames.length}`;
  buildScene();
  setView(m.view);
  try { localStorage.setItem("bto-viewer-model", m.key); } catch (e) { /* storage unavailable */ }
}

function toggle(id, key) {
  $(id).addEventListener("click", () => {
    state[key] = !state[key];
    $(id).setAttribute("aria-pressed", String(state[key]));
    if (key === "rep") buildScene();
    draw();
  });
}

// ---------- interaction ----------
const pointers = new Map();
let pinch0 = null;
stage.addEventListener("pointerdown", (e) => { stage.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); });
stage.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 1) {
    const dx = e.clientX - prev[0], dy = e.clientY - prev[1];
    if (e.shiftKey) { state.pan[0] += dx; state.pan[1] += dy; }
    else state.R = mul(rotX(-dy * 0.01), mul(rotY(dx * 0.01), state.R));
    draw();
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch0) { state.zoom = Math.min(8, Math.max(0.3, state.zoom * d / pinch0)); draw(); }
    pinch0 = d;
  }
});
const up = (e) => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch0 = null; };
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  state.zoom = Math.min(8, Math.max(0.3, state.zoom * Math.exp(-e.deltaY * 0.0015))); draw();
}, { passive: false });
stage.addEventListener("dblclick", () => setView(MODELS[state.model].view));

$("v-side").addEventListener("click", () => setView("side"));
$("v-top").addEventListener("click", () => setView("top"));
$("v-tilt").addEventListener("click", () => setView("tilt"));
toggle("t-rep", "rep"); toggle("t-cell", "cell"); toggle("t-fix", "fix");
$("img").addEventListener("input", (e) => {
  state.frame = +e.target.value - 1;
  $("imgout").textContent = `${e.target.value} / ${MODELS[state.model].frames.length}`;
  buildScene(); draw();
});
new ResizeObserver(() => draw()).observe(stage);
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

renderNav();
let start = 0;
try {
  const saved = localStorage.getItem("bto-viewer-model");
  const k = MODELS.findIndex((m) => m.key === (location.hash.slice(1) || saved));
  if (k >= 0) start = k;
} catch (e) { /* storage unavailable */ }
select(start);
</script>
