name: 実技タイマー (Android)

on:
  push:
    branches: ['**']
    # biyo-timer-v1.0.0 のようなタグを push すると APK 付きの Release を作る
    tags: ['biyo-timer-v*']
    paths:
      - 'biyo_timer/**'
      - '.github/workflows/biyo-timer-android.yml'
  pull_request:
    paths:
      - 'biyo_timer/**'
      - '.github/workflows/biyo-timer-android.yml'
  workflow_dispatch:
    inputs:
      emulator_test:
        description: 'エミュレータで UI テストを実行する'
        type: boolean
        default: true
      print_screenshots:
        description: 'スクリーンショットを縮小してログに出力する (デバッグ用)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: biyo-timer-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: biyo_timer

jobs:
  build:
    name: ビルド・ユニットテスト・lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: ユニットテスト
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: lint
        run: ./gradlew --no-daemon lintDebug

      - name: APK をビルド
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../biyo-timer.apk

      - uses: actions/upload-artifact@v6
        with:
          name: biyo-timer-apk
          path: biyo-timer.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: build-reports
          path: |
            biyo_timer/app/build/reports/
            biyo_timer/app/build/test-results/

  release:
    name: Release を作成
    needs: build
    if: startsWith(github.ref, 'refs/tags/biyo-timer-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: biyo-timer-apk
      - name: APK を添付して公開
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" biyo-timer.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "実技タイマー ${GITHUB_REF_NAME#biyo-timer-}" \
            --notes "Android 用のアプリです。biyo-timer.apk をダウンロードしてインストールしてください。"

  emulator:
    name: エミュレータで動作確認 (API ${{ matrix.api-level }})
    if: github.event_name == 'workflow_dispatch' && inputs.emulator_test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: KVM を有効化
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: テスト用 APK をビルド
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest assembleRelease

      - name: UI テストと起動確認
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: biyo_timer
          # 各行は別々のシェルで実行される
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest || touch ../ui-test-failed
            mkdir -p ../screenshots
            adb pull /data/local/tmp/biyo_timer_shots/. ../screenshots/ || true
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell pm grant io.github.twatanabe1436.biyotimer android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n io.github.twatanabe1436.biyotimer/.MainActivity
            sleep 5
            adb exec-out screencap -p > ../screenshots/09_release_launch.png
            adb logcat -d > ../logcat.txt || true
            adb logcat -d -b crash | grep -A30 biyotimer | tee ../crash.txt || true
            adb shell pidof io.github.twatanabe1436.biyotimer
            test ! -s ../crash.txt
            test ! -f ../ui-test-failed

      - name: スクリーンショットをログに出力
        if: always() && inputs.print_screenshots && matrix.api-level == 35
        working-directory: .
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, glob, io
          from PIL import Image
          for path in sorted(glob.glob('screenshots/*.png')):
              im = Image.open(path).convert('RGB')
              im.thumbnail((360, 800))
              buf = io.BytesIO()
              im.save(buf, 'JPEG', quality=70)
              data = base64.b64encode(buf.getvalue()).decode()
              print(f'=== SHOT {path}')
              for i in range(0, len(data), 1000):
                  print(data[i:i + 1000])
              print('=== END')
          PY

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: emulator-api${{ matrix.api-level }}
          path: |
            screenshots/
            logcat.txt
            biyo_timer/app/build/reports/androidTests/
            biyo_timer/app/build/outputs/androidTest-results/
