name: Hanaso 英会話 (Android)

on:
  push:
    branches: ['**']
    # hanaso-v0.1.0 のようなタグを push すると APK 付きの Release を作る
    # (手動実行で release_version を指定しても作れる)
    tags: ['hanaso-v*']
    paths:
      - 'hanaso_android/**'
      - '.github/workflows/hanaso-android.yml'
  pull_request:
    paths:
      - 'hanaso_android/**'
      - '.github/workflows/hanaso-android.yml'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'APK 付きの Release として公開するバージョン (例: 0.1.0)。空欄なら公開しない'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: hanaso-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: hanaso_android

jobs:
  build:
    name: ビルド・ユニットテスト・lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: コア (AI・シナリオ・採点) のテスト
        run: ./gradlew --no-daemon -p core test

      - name: アプリのユニットテスト
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: lint
        run: ./gradlew --no-daemon lintDebug

      - name: lint の指摘を表示
        if: always()
        run: cat app/build/reports/lint-results-debug.txt 2>/dev/null || true

      - name: APK をビルド
        env:
          # 公開用の署名鍵のパスワード (signing/README.md)。ない場合は debug 鍵で署名される
          HANASO_KEYSTORE_PASSWORD: ${{ secrets.HANASO_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../hanaso.apk
          ls -la ../hanaso.apk

      - name: APK の署名を確認
        env:
          RELEASING: ${{ startsWith(github.ref, 'refs/tags/hanaso-v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '') }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs ../hanaso.apk | tee ../signers.txt
          ACTUAL=$(grep -m1 'certificate SHA-256 digest' ../signers.txt | awk '{print $NF}')
          EXPECTED=$(cat signing/release-cert.sha256)
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "公開用の鍵で署名されています"
          elif [ "$RELEASING" = "true" ]; then
            # 違う鍵で署名した APK を公開すると、インストール済みのアプリを上書き更新できなくなる
            echo "::error::APK が公開用の鍵で署名されていません。secret HANASO_KEYSTORE_PASSWORD を設定してください (signing/README.md)"
            exit 1
          else
            echo "::notice::公開用の鍵ではなく debug 鍵で署名しました (Release は作りません)"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: hanaso-apk
          path: hanaso.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: build-reports
          path: |
            hanaso_android/core/build/reports/
            hanaso_android/app/build/reports/
            hanaso_android/app/build/test-results/

  release:
    name: Release を作成
    needs: [build, emulator]
    if: >-
      startsWith(github.ref, 'refs/tags/hanaso-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: hanaso-apk
      - name: APK を添付して公開
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          # タグの push ならそのタグ、手動実行なら hanaso-v<release_version> (無ければこのコミットに作る)
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('hanaso-v{0}', inputs.release_version) }}
        run: |
          # 同じリポジトリの他のアプリ (実技タイマー) の「最新版」リンクを変えないよう --latest=false にする
          gh release create "$TAG" hanaso.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "Hanaso 英会話 ${TAG#hanaso-}" \
            --notes "声で話して学ぶ英会話アプリ (Android 8.0 以降)。
          Android 端末で下の hanaso.apk をダウンロードしてタップするとインストールできます。
          API キーなしでも台本モードで練習できます。設定で Claude の API キーを入れると AI と自由に会話できます。
          v0.3.1 から署名鍵を固定したため、v0.3.0 以前を入れている場合は一度アンインストールしてから入れてください。"

  emulator:
    name: エミュレータで動作確認 (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: KVM を有効化
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: テスト用 APK をビルド
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest assembleRelease

      - name: UI テスト・端末上での Claude SDK テスト・起動確認
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: hanaso_android
          # 各行は別々のシェルで実行される
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            ./gradlew --no-daemon connectedDebugAndroidTest || touch ../ui-test-failed
            mkdir -p ../screenshots
            adb pull /data/local/tmp/hanaso_shots/. ../screenshots/ || true
            adb uninstall io.github.twatanabe1436.hanaso || true
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n io.github.twatanabe1436.hanaso/.MainActivity
            sleep 6
            adb exec-out screencap -p > ../screenshots/00_release_launch.png
            adb logcat -d > ../logcat.txt || true
            adb logcat -d -b crash | grep -A40 hanaso | tee ../crash.txt || true
            adb shell pidof io.github.twatanabe1436.hanaso
            test ! -s ../crash.txt
            test ! -f ../ui-test-failed

      - name: 失敗したテストの内容を表示
        if: failure()
        working-directory: .
        run: |
          for f in hanaso_android/app/build/outputs/androidTest-results/connected/debug/*.xml hanaso_android/app/build/outputs/androidTest-results/connected/*.xml; do
            [ -f "$f" ] && grep -B2 -A30 "<failure" "$f" | head -150
          done
          grep -E "AndroidRuntime|FATAL|hanaso" logcat.txt 2>/dev/null | tail -80 || true

      - name: スクリーンショットをログに出力 (確認用)
        if: always() && matrix.api-level == 35
        working-directory: .
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, glob, io
          from PIL import Image
          for path in sorted(glob.glob('screenshots/*.png')):
              im = Image.open(path).convert('RGB')
              im.thumbnail((300, 667))
              buf = io.BytesIO()
              im.save(buf, 'JPEG', quality=60)
              data = base64.b64encode(buf.getvalue()).decode()
              print(f'=== SHOT {path}')
              for i in range(0, len(data), 1000):
                  print(data[i:i + 1000])
              print('=== END')
          PY

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: emulator-api${{ matrix.api-level }}
          path: |
            screenshots/
            logcat.txt
            hanaso_android/app/build/reports/androidTests/
            hanaso_android/app/build/outputs/androidTest-results/
