name: そだてるレシピ (Android)

on:
  push:
    branches: ['**']
    # sodateru-v1.0.0 のようなタグを push すると APK 付きの Release を作る
    # (手動実行で release_version を指定しても作れる)
    tags: ['sodateru-v*']
    paths:
      - 'sodateru_recipe/**'
      - '.github/workflows/sodateru-recipe-android.yml'
  pull_request:
    paths:
      - 'sodateru_recipe/**'
      - '.github/workflows/sodateru-recipe-android.yml'
  workflow_dispatch:
    inputs:
      emulator_test:
        description: 'エミュレータで UI テストとリリース版の動作確認を行う'
        type: boolean
        default: true
      print_screenshots:
        description: 'スクリーンショットを縮小してログに出力する (デバッグ用)'
        type: boolean
        default: false
      release_version:
        description: 'APK 付きの Release として公開するバージョン (例: 1.0.1)。空欄なら公開しない'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: sodateru-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sodateru_recipe

env:
  # 署名鍵 (Settings → Secrets and variables → Actions に登録したもの)。
  # 未登録ならデバッグ鍵で署名する (README の「署名鍵」を参照)。
  SODATERU_KEYSTORE_PASSWORD: ${{ secrets.SODATERU_KEYSTORE_PASSWORD }}
  SODATERU_KEY_ALIAS: ${{ secrets.SODATERU_KEY_ALIAS }}
  SODATERU_KEY_PASSWORD: ${{ secrets.SODATERU_KEY_PASSWORD }}

jobs:
  build:
    name: ビルド・ユニットテスト・lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: 署名鍵を用意
        env:
          KEYSTORE_BASE64: ${{ secrets.SODATERU_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sodateru-release.jks"
            echo "SODATERU_KEYSTORE_FILE=$RUNNER_TEMP/sodateru-release.jks" >> "$GITHUB_ENV"
            echo "リリース用の鍵で署名します"
          else
            echo "::warning::SODATERU_KEYSTORE_BASE64 が未登録のため、デバッグ鍵で署名します (上書き更新できない場合があります)"
          fi

      - name: ユニットテスト (計算・解析ロジック)
        run: ./gradlew --no-daemon -p core test

      - name: lint
        # textReport = true なので指摘内容はこのログに出る
        run: ./gradlew --no-daemon lintDebug

      - name: APK をビルド
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../sodateru-recipe.apk
          ls -la ../sodateru-recipe.apk

      - uses: actions/upload-artifact@v6
        with:
          name: sodateru-recipe-apk
          path: sodateru-recipe.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: build-reports
          path: |
            sodateru_recipe/app/build/reports/
            sodateru_recipe/app/build/outputs/mapping/
            sodateru_recipe/core/build/reports/

  release:
    name: Release を作成
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/sodateru-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: sodateru-recipe-apk
      - name: APK を添付して公開
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          # タグの push ならそのタグ、手動実行なら sodateru-v<release_version> (無ければこのコミットに作る)
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('sodateru-v{0}', inputs.release_version) }}
        # 同じリポジトリの他のアプリ (実技タイマー) の「最新版」リンクを奪わないよう --latest=false にし、
        # 代わりに sodateru-latest という固定タグの Release を毎回作り直して、ダウンロード用の URL を固定する。
        run: |
          NOTES="レシピを育てるノートアプリ (Android 8.0 以降)。
          Android 端末で下の sodateru-recipe.apk をダウンロードしてタップするとインストールできます。"
          gh release create "$TAG" sodateru-recipe.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "そだてるレシピ ${TAG#sodateru-}" \
            --notes "$NOTES"
          gh release delete sodateru-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create sodateru-latest sodateru-recipe.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "そだてるレシピ (最新版: ${TAG#sodateru-})" \
            --notes "$NOTES"

  emulator:
    name: エミュレータで動作確認 (API ${{ matrix.api-level }})
    if: github.event_name == 'workflow_dispatch' && inputs.emulator_test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: KVM を有効化
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: テスト用 APK をビルド
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest assembleRelease

      - name: UI テストとリリース版の動作確認
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: sodateru_recipe
          # 各行は別々のシェルで実行される
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            ./gradlew --no-daemon connectedDebugAndroidTest || touch ../ui-test-failed
            mkdir -p ../screenshots
            adb pull /data/local/tmp/sodateru_shots/. ../screenshots/ || true
            adb uninstall io.github.twatanabe1436.sodateru || true
            adb install -r app/build/outputs/apk/release/app-release.apk
            python3 scripts/release_smoke.py ../screenshots || touch ../release-smoke-failed
            adb logcat -d > ../logcat.txt || true
            adb logcat -d -b crash | grep -A30 sodateru | tee ../crash.txt || true
            test ! -s ../crash.txt
            test ! -f ../ui-test-failed
            test ! -f ../release-smoke-failed

      - name: スクリーンショットをログに出力
        if: always() && inputs.print_screenshots && matrix.api-level == 35
        working-directory: .
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, glob, io
          from PIL import Image
          for path in sorted(glob.glob('screenshots/*.png')):
              im = Image.open(path).convert('RGB')
              im.thumbnail((360, 800))
              buf = io.BytesIO()
              im.save(buf, 'JPEG', quality=70)
              data = base64.b64encode(buf.getvalue()).decode()
              print(f'=== SHOT {path}')
              for i in range(0, len(data), 1000):
                  print(data[i:i + 1000])
              print('=== END')
          PY

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: emulator-api${{ matrix.api-level }}
          path: |
            screenshots/
            logcat.txt
            sodateru_recipe/app/build/reports/androidTests/
            sodateru_recipe/app/build/outputs/androidTest-results/
